{# aws-i18n: complete #}
{# The language selector. The choice is kept in the aws_language cookie; the
   function is inline because the login page does not load aws_utils.js. #}
<div class="theme_switch">
  <select id="lang" title="{{ _("Language") }}" aria-label="{{ _("Language") }}" onchange="switchLanguage(this.value)">
    <option value=""{% if cookie_translation is none %} selected{% endif %}>{% trans lang=automatic_translation.name %}Automatic ({{ lang }}){% endtrans %}</option>
    {% for lang_code, t in available_translations|dictsort(by="key") %}
    <option value="{{ lang_code }}"{% if t == cookie_translation %} selected{% endif %}>{{ t.name }}</option>
    {% endfor %}
  </select>
</div>
<script>
function switchLanguage(lang) {
    if (lang === "") {
        document.cookie = "aws_language="
            + "; expires=Thu, 01 Jan 1970 00:00:00 GMT"
            + "; path=/";
    } else {
        var expires = new Date();
        expires.setFullYear(expires.getFullYear() + 1);
        document.cookie = "aws_language=" + lang
            + "; expires=" + expires.toUTCString()
            + "; path=/";
    }
    location.reload();
}
</script>
