{# aws-i18n: complete #}
{# The light/dark switch; theme.js wires it (the choice is kept in the browser). #}
<div class="theme_switch">
  <select id="theme" title="{{ _("Theme") }}" aria-label="{{ _("Theme") }}">
    <option value="system">{{ _("System") }}</option>
    <option value="light">{{ _("Light") }}</option>
    <option value="dark">{{ _("Dark") }}</option>
  </select>
</div>
