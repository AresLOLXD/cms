{# aws-i18n: complete #}
{% extends "base.html" %}

{% block core %}
<div class="core_title">
  <h1><a href="{{ url("task", task.id) }}">{{ task.title }} ({{ task.name }})</a> - {% trans %}Upload statement{% endtrans %}</h1>
</div>
<form enctype="multipart/form-data" action="{{ url("task", task.id, "statements", "add") }}" method="POST">
  {{ xsrf_form_html|safe }}
  {% trans %}Language code:{% endtrans %} <input type="text" name="language"/><br/>
  <input type="file" name="statement"/><br/>
  <input type="submit" value="{{ _("Upload") }}">
  <input type="Reset" >
</form>
{% endblock core %}
