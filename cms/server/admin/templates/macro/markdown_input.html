{% macro markdown_input(name) %}
<textarea name="{{ name }}" class="markdown_input"></textarea><br/>
{% trans %}You can use Markdown here. URLs are not automatically linked, surround them with &lt;&gt; like &lt;http://example.org&gt;.{% endtrans %}
<div class="markdown_preview"></div>
{% endmacro %}

{% macro markdown_preview() %}
<input type="button" value="{{ _("Preview Markdown") }}" onclick="utils.render_markdown_preview(this)" />
{% endmacro %}
