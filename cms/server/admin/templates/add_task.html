{# aws-i18n: complete #}
{% extends "base.html" %}

{% block core %}

<div class="core_title">
  <h1>{% trans %}New task{% endtrans %}</h1>
</div>

<!-- We use "multipart/form-data" to have Tornado distinguish between missing and empty values. -->
<form enctype="multipart/form-data" action="{{ url("tasks", "add") }}" method="post" >
  {{ xsrf_form_html|safe }}
  <span class="info" title="{{ _("A short name for the task, preferably using only letters, numbers and underscores.") }}"></span>
  {% trans %}Name:{% endtrans %}
  <input type="text" name="name">

  <input type="submit">
</form>

{% endblock core %}
