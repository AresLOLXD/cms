{# aws-i18n: complete #}
{% extends "base.html" %}

{% block js %}

{% endblock js %}

{% block core %}
<div class="core_title">
  <h1>{% trans %}New contest{% endtrans %}</h1>
</div>

<!-- We use "multipart/form-data" to have Tornado distinguish between missing and empty values. -->
<form enctype="multipart/form-data" action="{{ url("contests", "add") }}" method="POST" name="add_contest">
  {{ xsrf_form_html|safe }}
  <span class="info" title="{{ _("A short name for the contest, preferably using only letters, numbers and underscores.") }}"></span>
  {% trans %}Name:{% endtrans %}
  <input type="text" name="name">

  <input type="submit" value="{{ _("Submit") }}">
</form>

{% endblock core %}
