# Contest-shaped CMS deployment for load testing: one "cms" container
# with every service (started by start.sh), a local PostgreSQL and the
# standalone ranking web server, plus a driver container that generates
# the load. The same file runs both targets: LOAD_TARGET selects the
# image, cmsload-fork:latest or cmsload-upstream:latest, which build.sh
# builds from a git ref with that ref's own Dockerfile.
#
# Use run.sh, which writes .env.load and the rendered config in run/ and
# runs this file with the rootful engine under the project name
# cmsload-<target>:
#   ./build.sh fork beta
#   ./run.sh --target fork --profile full --name full1
#
# Both images define user cmsuser (uid 2000), put /home/cmsuser/cms/bin on
# the PATH and read the config from CMS_CONFIG / CMS_RANKING_CONFIG. The
# fork's image has an entrypoint that generates a config from the
# environment, the upstream one has none, so "entrypoint: []" makes the
# two behave alike and run.sh's rendered config is the only config.

services:
  db:
    image: docker.io/postgres:17-alpine
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: ${LOAD_DB_PASSWORD}
      POSTGRES_DB: cmsdb
    # Default max_connections (100), like the prod compose. Only observation
    # knobs are added: slow statements and lock waits go to the log.
    command: >
      postgres -c log_min_duration_statement=1000 -c log_lock_waits=on
               -c deadlock_timeout=1s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cmsdb"]
      interval: 2s
      timeout: 5s
      retries: 30

  db-init:
    image: cmsload-${LOAD_TARGET}:latest
    entrypoint: []
    environment:
      CMS_CONFIG: /loadtest/run/cms.toml
    volumes:
      - ./:/loadtest
    depends_on:
      db:
        condition: service_healthy
    command: ["cmsInitDB"]
    restart: "no"

  # Both builds read CMS_RANKING_CONFIG (cmsranking/Config.py), so the
  # rendered file is used as it is and no default path is overridden.
  ranking:
    image: cmsload-${LOAD_TARGET}:latest
    entrypoint: []
    environment:
      CMS_RANKING_CONFIG: /loadtest/run/cms_ranking.toml
    volumes:
      - ./:/loadtest
    command: ["cmsRankingWebServer"]
    stop_grace_period: 5s

  cms:
    image: cmsload-${LOAD_TARGET}:latest
    entrypoint: []
    # start.sh is the container's main process: an init reaps the zombies
    # of the services that died and forwards the stop signal.
    init: true
    environment:
      CMS_CONFIG: /loadtest/run/cms.toml
      LOAD_WORKER_COUNT: ${LOAD_WORKER_COUNT}
      LOAD_CWS_COUNT: ${LOAD_CWS_COUNT}
      TZ: UTC
    depends_on:
      db-init:
        condition: service_completed_successfully
      ranking:
        condition: service_started
    volumes:
      - ./:/loadtest
    command: ["bash", "/loadtest/start.sh"]
    stop_grace_period: 5s
    privileged: true
    cgroup: host
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # The driver image is not a CMS build: compose builds it from ./driver
  # the first time and reuses it for every target.
  driver:
    image: cmsload-driver:latest
    build:
      context: ./driver
    volumes:
      - ./:/loadtest
    command: ["sleep", "infinity"]
    stop_grace_period: 1s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
