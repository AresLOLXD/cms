# Contest-shaped CMS deployment for load testing (mirrors
# docker/docker-compose.prod.yml of main: one "cms" container with every
# service under supervisord, a local PostgreSQL and the standalone ranking).
#
# Run with the rootful engine and a project name starting with "cmsload-":
#   sg docker -c "docker --context default compose -p cmsload-run \
#       -f compose.yml --env-file .env.load up -d --build"
# .env.load is written by run.sh (it holds the throwaway secret key).

services:
  db:
    image: docker.io/postgres:17-alpine
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: ${LOAD_DB_PASSWORD}
      POSTGRES_DB: cmsdb
    # Default max_connections (100), like the prod compose. Only observation
    # knobs are added: slow statements and lock waits go to the log.
    command: >
      postgres -c log_min_duration_statement=1000 -c log_lock_waits=on
               -c deadlock_timeout=1s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cmsdb"]
      interval: 2s
      timeout: 5s
      retries: 30

  db-init:
    image: cmsload-cms:latest
    build:
      context: ./src
    environment: &cmsenv
      CMS_DB_URL: postgresql+psycopg2://cms:${LOAD_DB_PASSWORD}@db:5432/cmsdb
      CMS_SECRET_KEY: ${LOAD_SECRET_KEY}
      CMS_CONTEST_ID: ALL
      CMS_CWS_COUNT: ${LOAD_CWS_COUNT:-2}
      CMS_WORKER_COUNT: ${LOAD_WORKER_COUNT:-8}
      CMS_TWO_PHASE_EVALUATION: "true"
      CMS_CWS_HTTP_PORT: 8888
      CMS_AWS_HTTP_PORT: 8898
      CMS_RWS_HTTP_PORT: 8890
      CMS_RWS_HOST: ranking
      CMS_RWS_USERNAME: rwsload
      CMS_RWS_PASSWORD: ${LOAD_RWS_PASSWORD}
      CMS_LOG_DEBUG: "false"
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy
    command: ["cmsSetupDB"]
    restart: "no"

  ranking:
    image: cmsload-ranking:latest
    build:
      context: ./src
      dockerfile: docker/Dockerfile.ranking
    environment:
      CMS_RANKING_ONLY: "true"
      CMS_RWS_HTTP_PORT: 8890
      CMS_RWS_USERNAME: rwsload
      CMS_RWS_PASSWORD: ${LOAD_RWS_PASSWORD}
      TZ: UTC
    command: ["cmsRankingWebServer"]

  cms:
    image: cmsload-cms:latest
    environment: *cmsenv
    depends_on:
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./:/loadtest
    tmpfs:
      - /home/cmsuser/cms/run
    privileged: true
    cgroup: host
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  driver:
    image: cmsload-driver:latest
    build:
      context: ./driver
    volumes:
      - ./:/loadtest
    command: ["sleep", "infinity"]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
