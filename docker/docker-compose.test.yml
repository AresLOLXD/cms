services:
  testdb:
    image: docker.io/postgres:15
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust

  testcms:
    build: ..
    depends_on:
      - "testdb"
    environment:
      CMS_CONFIG: /home/cmsuser/cms/etc/cms-testdb.toml
      # The entrypoint regenerates cms_ranking.toml from these two variables
      # (default: "rws" and an empty password), while cms-testdb.toml is baked
      # from config/cms.sample.toml, so ProxyService pushes to
      # http://usern4me:passw0rd@localhost:8890/. Keep them equal or
      # RankingWebServer answers every push with 401.
      CMS_RWS_USERNAME: usern4me
      CMS_RWS_PASSWORD: passw0rd
      # Could be removed in the future, see:
      # - https://github.com/pytest-dev/pytest/issues/7443
      # - https://github.com/actions/runner/issues/241
      PYTEST_ADDOPTS: --color=yes
    volumes:
      - "../codecov:/home/cmsuser/src/codecov"
    privileged: true
    cgroup: host
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command: wait-for-it testdb:5432 -- docker/_cms-test-internal.sh

  stresstestcms:
    build: ..
    depends_on:
      - "testdb"
    environment:
      CMS_CONFIG: /home/cmsuser/cms/etc/cms-testdb.toml
    privileged: true
    cgroup: host
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command: wait-for-it testdb:5432 -- docker/_cms-stresstest-internal.sh
