services:
  devdb:
    image: docker.io/postgres:15
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - "../.dev/postgres-data:/var/lib/postgresql/data"

  devcms:
    build: ..
    depends_on:
      - "devdb"
    environment:
      CMS_CONFIG: /home/cmsuser/cms/etc/cms-devdb.toml
      # The entrypoint regenerates cms_ranking.toml from these two variables
      # (default: "rws" and an empty password), while cms-devdb.toml is baked
      # from config/cms.sample.toml, so ProxyService pushes to
      # http://usern4me:passw0rd@localhost:8890/. Keep them equal or
      # RankingWebServer answers every push with 401.
      CMS_RWS_USERNAME: usern4me
      CMS_RWS_PASSWORD: passw0rd
    volumes:
      - "..:/home/cmsuser/src"
    privileged: true
    cgroup: host
    command: >
      wait-for-it devdb:5432 -- bash
    ports:
      - 8888:8888
      - 8889:8889
      - 8890:8890
