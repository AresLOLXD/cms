schema: spec-driven

context: |
  Fork (OMI) of the Contest Management System: Python >=3.11 (3.12 in dev/CI),
  PostgreSQL only, asyncio services plus gevent in Worker/cmsranking/some cmscontrib.
  Write every OpenSpec artifact in English. Code, comments and commit messages too.
  Specs describe behavior seen by contestants (CWS), admins (AWS), the ranking (RWS),
  importers and grading, not internals.
  Tests are pytest. Never run a bare pytest over the whole suite: the gevent and
  asyncio groups need separate processes (see CLAUDE.md, "Testing").
  Lint is `pyflakes cms cmscommon cmscontrib cmsranking cmstaskenv cmstestsuite`,
  plus eslint for JS under cms/server/*/static.
  Every Scenario in a delta spec needs at least one test.

rules:
  tasks:
    - Group tasks so each group can get its own Superpowers plan and be reviewed alone
    - Put the test task next to the behavior task it covers
  specs:
    - Every Requirement has at least one Scenario

operations:
  apply:
    guidance:
      - Tick the checkbox in tasks.md as each task is done
      - If behavior diverges from the delta spec, stop and run /opsx:update or ask
  archive:
    guidance:
      - Archive only after tests and verify pass
