name: ci

# flaky/ branches only run the flaky workflow: its 20 parallel jobs fill
# the 20 concurrent jobs GitHub Free allows, and this one would queue
# behind them. loadtest/ branches only run the loadtest workflow: they are
# pushed to start a load test, not to test the commit again. Tags are
# listed so that they keep triggering the workflow, as a bare `push` did:
# listing only branches-ignore would drop them.
on:
  push:
    branches-ignore:
      - "flaky/**"
      - "loadtest/**"
    tags:
      - "**"
  pull_request:

# The job only checks the repository out.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    # Two jobs: the newest PostgreSQL major on noble, whose own client is older
    # than the server, so it needs a PGDG 19 pg_dump (PG_CLIENT_MAJOR), and the
    # minimum supported major (17) on trixie with Debian's own client, in the
    # same alpine variant as the bundled localdb.
    env:
      TEST_PG_VERSION: ${{ matrix.pg_version }}

    strategy:
      # A red job must not cancel the other one: it shows whether the failure
      # is specific to the PostgreSQL major (or to the PGDG fetch).
      fail-fast: false
      matrix:
        include:
          - base_image: "ubuntu:noble"
            pg_version: "19.0"
            pg_client_major: "19"
          - base_image: "debian:trixie"
            pg_version: "17.12-alpine"
            pg_client_major: ""

    steps:
      - uses: actions/checkout@v5

      - name: Check available cgroups
        run: |
          mount | grep cgroup

      - name: Build docker image
        run: |
          docker compose -p cms -f docker/docker-compose.test.yml build \
              --build-arg BASE_IMAGE=${{ matrix.base_image }} \
              --build-arg PG_CLIENT_MAJOR=${{ matrix.pg_client_major }} testcms

      # The container's cmsuser (uid 2000) writes the test reports into the
      # bind-mounted codecov/ but can't chown it (its sudo is limited to
      # isolate). Left to Docker, the directory would be created root:root
      # 755 and pytest couldn't write its junit report there.
      - name: Make the codecov directory writable
        run: |
          mkdir -p codecov && chmod 777 codecov

      - name: Run tests
        run: |
          docker compose -p cms -f docker/docker-compose.test.yml run --rm testcms
