name: loadtest

# Run the load-test harness (cmstestsuite/loadtest/, see its README) on
# GitHub-hosted runners: the pushed commit (target fork) against stock
# upstream CMS at UPSTREAM_REF (target upstream). Start it by pushing the
# commit to test to a loadtest/ branch, and delete the branch afterwards:
#   git push origin <commit>:refs/heads/loadtest/<topic>
#   git push origin --delete loadtest/<topic>
# (workflow_dispatch would need this file on the default branch first.)
#
# The scenario is the env block below: the run.sh options of the same
# names. Change it in the commit you push. Each "pair" job is one repeat
# on its own runner (ubuntu-24.04: 4 vCPUs, 16 GB): it builds both images,
# then runs fork and upstream one after the other, alternating which one
# goes first, so that the variation between runners does not bias the
# comparison. The full profile runs the fork only. "compare" puts the
# metrics of every run side by side.
#
# Cost: standard runners are free on this public repository; the 3 pair
# jobs take 3 of the 20 concurrent jobs GitHub Free allows. Duration:
# about 2 h with the defaults below (two image builds and two runs of
# 30-40 min per job), about 1 h with the README's smoke values.
on:
  push:
    branches:
      - "loadtest/**"

# The jobs only check the repository out and pass artifacts to each other.
permissions:
  contents: read

env:
  LOAD_USERS_A: "14"
  LOAD_USERS_B: "6"
  LOAD_LOGIN_WINDOW: "60"
  LOAD_CONTEST: "480"
  LOAD_END_BURST: "120"
  LOAD_RATE: "10"
  LOAD_END_BURST_FACTOR: "1.0"
  LOAD_WORKERS: "8"
  LOAD_CWS: "4"
  # portable or full; full has no upstream counterpart.
  LOAD_PROFILE: portable
  # The merge-base of the fork and upstream, as in the README.
  UPSTREAM_REF: cc9dfafb

jobs:
  pair:
    runs-on: ubuntu-24.04
    # Under the 6 h limit of a job, so that the results are still uploaded.
    timeout-minutes: 330

    strategy:
      # Every repeat is a sample: one failure must not cancel the others.
      fail-fast: false
      matrix:
        repeat: [1, 2, 3]

    env:
      REPEAT: ${{ matrix.repeat }}

    defaults:
      run:
        # bash with pipefail, so that "run.sh | tee" fails when run.sh does.
        shell: bash
        working-directory: cmstestsuite/loadtest

    steps:
      # build.sh takes the source with "git archive <ref>": UPSTREAM_REF
      # must be in the history.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Two CMS images of about 4 GB each, their build cache and the
      # database do not fit in what the runner's disk has free; these
      # preinstalled toolchains are not used here.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
              /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Record the runner and the run order
        run: |
          if [[ $LOAD_PROFILE == full ]]; then
            order=fork
          elif ((REPEAT % 2)); then
            order="fork upstream"
          else
            order="upstream fork"
          fi
          echo "ORDER=$order" >>"$GITHUB_ENV"
          mkdir -p out
          {
            echo "repeat $REPEAT, run order: $order"
            echo "nproc: $(nproc)"
            lscpu | grep '^Model name'
            echo "kernel: $(uname -r)"
            free -g
            df -h /
            env | grep -E '^(LOAD_|UPSTREAM_REF=)' | sort
          } | tee out/runner.txt

      - name: Build the fork image
        run: ./build.sh fork HEAD

      - name: Build the upstream image
        if: env.LOAD_PROFILE != 'full'
        run: ./build.sh upstream "$UPSTREAM_REF"

      # One target after the other, with a teardown in between: run.sh
      # refuses to start while another target's stack is up. A failed run
      # does not stop the other one.
      - name: Run ${{ env.ORDER }}
        run: |
          failed=0
          for target in $ORDER; do
            name=ci-$REPEAT-$target
            echo "::group::$name"
            began=$(date -u +%FT%TZ)
            rc=0
            ./run.sh --target "$target" --profile "$LOAD_PROFILE" \
                --name "$name" --users-a "$LOAD_USERS_A" \
                --users-b "$LOAD_USERS_B" \
                --login-window "$LOAD_LOGIN_WINDOW" \
                --contest "$LOAD_CONTEST" --end-burst "$LOAD_END_BURST" \
                --rate "$LOAD_RATE" \
                --end-burst-factor "$LOAD_END_BURST_FACTOR" \
                --workers "$LOAD_WORKERS" --cws "$LOAD_CWS" 2>&1 |
              tee "out/run-$name.log" || rc=$?
            disk=$(df -h --output=used,avail / | tail -1)
            ./teardown.sh "$target" 2>&1 | tee -a "out/run-$name.log" || rc=$?
            echo "::endgroup::"
            echo "$name: $began to $(date -u +%FT%TZ), exit $rc;" \
                "disk used and free before the teardown:$disk" |
              tee -a out/runner.txt
            ((rc == 0)) || failed=1
          done
          exit "$failed"

      - name: Summarize the runs
        if: always()
        run: |
          shopt -s nullglob
          {
            echo "## Repeat $REPEAT"
            echo
            echo '```'
            cat out/runner.txt
            echo '```'
            for dir in out/ci-*/; do
              name=$(basename "$dir")
              echo
              echo "### $name"
              echo
              if [[ ! -f $dir/metrics.json ]]; then
                echo "No metrics.json: the run did not finish, see" \
                    "run-$name.log in the artifact."
                continue
              fi
              {
                sed -n '3,4p' "$dir/summary.md"
                grep -e '^Login failures' -e '^Submissions sent' \
                    -e '^Never scored' -e '^Rows not identified' \
                    -e '^Score mismatches' -e '^Final RWS' "$dir/summary.md"
                grep SHORT "$dir/processes_end.txt"
              } | sed 's/^/- /' || true
              echo
              python3 compare.py "$dir"
            done
          } >>"$GITHUB_STEP_SUMMARY"
          # The disk use at the end, for sizing the "Free disk space" step.
          df -h /
          docker system df

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: loadtest-${{ matrix.repeat }}
          path: cmstestsuite/loadtest/out/
          # A re-run of the job replaces the artifact of the failed attempt.
          overwrite: true

  compare:
    needs: pair
    # Compare what there is, even if a repeat failed.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          pattern: loadtest-*
          path: results

      # --median groups by target only: every run here has the same
      # profile, LOAD_PROFILE.
      - name: Compare the runs
        run: |
          shopt -s nullglob
          runs=()
          missing=()
          for dir in results/*/ci-*-fork results/*/ci-*-upstream; do
            if [[ -f $dir/metrics.json ]]; then
              runs+=("$dir")
            else
              missing+=("${dir##*/}")
            fi
          done
          if ((${#runs[@]} == 0)); then
            echo "No run has a metrics.json" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo "## Median per target, profile $LOAD_PROFILE"
            echo
            python3 cmstestsuite/loadtest/compare.py "${runs[@]}" --median
            echo
            echo "## Every run"
            echo
            python3 cmstestsuite/loadtest/compare.py "${runs[@]}"
            if ((${#missing[@]})); then
              echo
              echo "No metrics.json (the run did not finish): ${missing[*]}"
            fi
          } >compare.md
          cat compare.md >>"$GITHUB_STEP_SUMMARY"

      - name: Upload the comparison
        uses: actions/upload-artifact@v7
        with:
          name: loadtest-compare
          path: compare.md
          overwrite: true
