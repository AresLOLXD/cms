<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset='utf-8'/>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="shortcut icon" href="img/favicon.ico" />
        <script src="theme.js"></script>
        <script src="i18n.js"></script>
        <link rel='stylesheet' href='Ranking.css'>
        <script src="//ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
        <script>
if (typeof jQuery == 'undefined') {
    document.write(unescape("%3Cscript src='lib/jquery.js'%3E%3C/script%3E"));
}
if (!("EventSource" in window)) {
    document.write(unescape("%3Cscript src='lib/eventsource.js'%3E%3C/script%3E"));
}
        </script>
        <script src="lib/raphael.js"></script>
        <!--[if lt IE 9]>
            <script src="lib/explorercanvas.js"></script>
        <![endif]-->
        <script src="Config.js"></script>
        <script src="DataStore.js"></script>
        <script src="HistoryStore.js"></script>
        <script src="Chart.js"></script>
        <script src="UserDetail.js"></script>
        <script src="TimeView.js"></script>
        <script src="TeamSearch.js"></script>
        <script src="Overview.js"></script>
        <script src="Scoreboard.js"></script>
        <script src="Ranking.js"></script>
        <title data-i18n="title.ranking">Ranking</title>
    </head>
    <body class="teams-hidden">
        <div id="OuterFrame">
            <div id="LogoPanel">
                <img src="logo" alt="Logo" data-i18n-attr="alt:alt.logo" />
            </div>
            <div id="UpperPanel">
                <div id="ConnectionStatus_box">
                    <div id="ConnectionStatus_label" data-i18n="label.status">Status</div>
                    <div id="ConnectionStatus_text"></div>
                </div>
                <select id="theme" lang="es" title="Tema" aria-label="Tema">
                    <option value="system">Sistema</option>
                    <option value="light">Claro</option>
                    <option value="dark">Oscuro</option>
                </select>
                <select id="language" lang="es" title="Idioma" aria-label="Idioma">
                    <option value="es">Español</option>
                    <option value="en" lang="en">English</option>
                </select>
            </div>
            <div id="TimeView">
                <div id="TimeView_name"></div>
                <div id="TimeView_selector">
                    <div id="TimeView_time"></div><div id="TimeView_expand"><div class="caret"></div></div>
                    <div id="TimeView_selector_elapsed" data-i18n="time.elapsed">Elapsed time</div>
                    <div id="TimeView_selector_remaining" data-i18n="time.remaining">Remaining time</div>
                    <div id="TimeView_selector_current" data-i18n="time.current">Current time</div>
                </div>
            </div>
            <div id="SidePanel">
                <div id="Overview"></div>
                <div class="powered_by">
                    <span data-i18n="powered.by">Powered by</span> <a href="https://cms-dev.github.io/" target="_blank">CMS</a>
                </div>
            </div>
            <div id="InnerFrame">
                <button id="Scoreboard_tasks_toggle" type="button" aria-controls="Scoreboard" aria-expanded="false" hidden data-i18n="button.show_tasks">Show tasks</button>
                <table id="Scoreboard">
                    <colgroup id="Scoreboard_cols"></colgroup>
                    <thead id="Scoreboard_head"></thead>
                    <tbody id="Scoreboard_body"></tbody>
                </table>
            </div>
        </div>
        <input id="TeamSearch_input" type="search" placeholder="Search Team" data-i18n-attr="placeholder:search.placeholder"/>
        <div id="TeamSearch_bg">
            <div id="TeamSearch">
                <img id="TeamSearch_close" src="img/close.png" alt="Close" data-i18n-attr="alt:alt.close"/>
                <div id="TeamSearch_body"></div>
            </div>
        </div>
        <div id="UserDetail_bg">
            <div id="UserDetail">
                <img id="UserDetail_close" src="img/close.png" alt="Close" data-i18n-attr="alt:alt.close"/>
                <div id="UserDetail_header" style="display: flex;">
                    <div id="UserDetail_summary" style="flex-grow: 1">
                       <div>
                           <span id="UserDetail_f_name"></span>
                           <span id="UserDetail_l_name"></span>
                       </div>
                        <img id="UserDetail_face" src="" alt="Face" data-i18n-attr="alt:alt.face"/>
                       <div id="UserDetail_spacer"></div>
                        <div id="UserDetail_team"></div>
                        <img id="UserDetail_flag" src="" alt="Flag" data-i18n-attr="alt:alt.flag"/>
                    </div>
                    <div id="UserDetail_navigator" style="flex-grow: 1">
                        <table>
                            <col class="name"/>
                            <col class="score"/>
                            <col class="rank"/>
                            <col class="show"/>
                            <thead>
                                <tr>
                                    <td></td>
                                    <td data-i18n="col.score">Score</td>
                                    <td data-i18n="col.rank">Rank</td>
                                    <td></td>
                                </tr>
                            </thead>
                            <tbody id="UserDetail_scores">
                            </tbody>
                        </table>
                    </div>
                </div>
                <div id="UserDetail_title"></div>
                <div id="UserDetail_charts">
                    <canvas id="UserDetail_score_chart" width="920" height="250"></canvas>
                    <canvas id="UserDetail_rank_chart" width="920" height="250"></canvas>
                </div>
                <div id="UserDetail_submissions">
                </div>
            </div>
        </div>
    </body>
</html>
